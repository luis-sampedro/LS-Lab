{% extends "base.html" %}

{% block title %}Informe de Análisis - LS Lab{% endblock %}

{% block extra_head %}
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}
<section class="section">
    <div style="margin-bottom: 2rem;">
        <a href="/boat/{{ boat_id }}/sail/{{ sail_id }}?lang=es" style="color: #94a3b8; text-decoration: none;">&larr;
            Volver al Historial</a>

        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 1rem;">
            <div>
                <h1 style="margin-bottom: 0.5rem;" id="reportTitle">Cargando...</h1>
                <p style="color: #64748b;" id="reportDate"></p>
            </div>
            <!-- Delete Action -->
            <button id="deleteBtn" class="btn secondary"
                style="border-color: #ef4444; color: #ef4444; display:none;">Eliminar Informe</button>
        </div>
    </div>

    <div class="app-grid" style="grid-template-columns: 1fr 1fr; gap: 2rem;">
        <!-- Left: Image Snapshot -->
        <div class="metric-card" style="padding: 0; overflow: hidden; height: fit-content;">
            <img id="snapshotImg" style="width: 100%; display: none;" alt="Instantánea del Análisis">
            <div id="noSnapshotMsg" style="padding: 2rem; text-align: center; color: #64748b; display:none;">No hay
                imagen disponible.</div>
        </div>

        <!-- Right: Metrics & Plots -->
        <div style="display: flex; flex-direction: column; gap: 2rem;">

            <!-- Metrics Table -->
            <div class="metric-card">
                <h2>Métricas de Rendimiento</h2>
                <table style="width: 100%; border-collapse: collapse; margin-top: 1rem;" id="metricsTable">
                    <thead>
                        <tr style="border-bottom: 1px solid #334155; text-align: left;">
                            <th style="padding: 8px; color: #94a3b8;">Métrica</th>
                            <th style="padding: 8px; color: #94a3b8;">Valor</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- JS populated -->
                    </tbody>
                </table>
            </div>

            <!-- Plot -->
            <div class="metric-card">
                <h2>Perfil de Curvatura</h2>
                <div style="position: relative; height: 300px; width: 100%;">
                    <canvas id="camberChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</section>

<script type="module">
    import { auth, onAuthStateChanged } from "{{ url_for('static', filename='js/firebase-init.js') }}";

    const boatId = "{{ boat_id }}";
    const sailId = "{{ sail_id }}";
    const analysisId = "{{ analysis_id }}";

    // Auth Check
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = "{{ url_for('login', lang='es') }}";
            return;
        }

        const token = await user.getIdToken();
        loadReport(token);

        // Setup Delete button
        const delBtn = document.getElementById('deleteBtn');
        delBtn.style.display = 'block';
        delBtn.onclick = async () => {
            if (!confirm('¿Estás seguro de eliminar este informe?')) return;
            const res = await fetch(`/api/boats/${boatId}/sails/${sailId}/analyses/${analysisId}`, {
                method: 'DELETE',
                headers: { 'Authorization': token }
            });
            if (res.ok) window.location.href = `/boat/${boatId}/sail/${sailId}?lang=es`;
            else alert('Error al eliminar');
        };
    });

    async function loadReport(token) {
        try {
            const res = await fetch(`/api/boats/${boatId}/sails/${sailId}/analyses/${analysisId}`, {
                headers: { 'Authorization': token }
            });

            if (!res.ok) {
                document.getElementById('reportTitle').innerText = "Informe No Encontrado";
                return;
            }

            const data = await res.json();

            // 1. Header (Date/Time + Context)
            const dateObj = new Date(data.date || data.created_at);
            const dateStr = isNaN(dateObj) ? (data.date || 'Fecha Desconocida') : dateObj.toLocaleString();

            // Fetch Context
            let contextStr = "";
            try {
                const [boatRes, sailRes] = await Promise.all([
                    fetch(`/api/boats/${boatId}`, { headers: { 'Authorization': token } }),
                    fetch(`/api/boats/${boatId}/sails/${sailId}`, { headers: { 'Authorization': token } })
                ]);
                const boat = await boatRes.json();
                const sail = await sailRes.json();
                contextStr = `${boat.name} • ${sail.code}`;
            } catch (e) { console.error("Context fetch error", e); }

            document.getElementById('reportTitle').innerHTML = `Informe de Análisis <span style="font-size: 1rem; color: #64748b; font-weight: normal; margin-left: 1rem;">${contextStr}</span>`;
            document.getElementById('reportDate').innerText = dateStr;

            // 2. Snapshot
            if (data.snapshot) {
                const img = document.getElementById('snapshotImg');
                img.src = data.snapshot;
                img.style.display = 'block';
            } else {
                document.getElementById('noSnapshotMsg').style.display = 'block';
            }

            // 3. Metrics Table
            const thead = document.querySelector('#metricsTable thead');
            const tbody = document.querySelector('#metricsTable tbody');
            const m = data.metrics || {};

            // Determine Stripes
            let stripes = [];
            if (m.stripes && Array.isArray(m.stripes) && m.stripes.length > 0) {
                stripes = m.stripes.sort((a, b) => a.id - b.id);
            } else if (m.camber !== undefined) {
                // Legacy / Single Stripe fallback
                stripes = [{ id: 1, metrics: m }];
            }

            if (stripes.length > 0) {
                // Build Header
                let headerHTML = '<tr style="border-bottom: 1px solid #334155; text-align: left;"><th style="padding: 8px; color: #94a3b8;">Métrica</th>';
                stripes.forEach(s => {
                    headerHTML += `<th style="padding: 8px; color: #38bdf8;">Franja #${s.id}</th>`;
                });
                headerHTML += '</tr>';
                thead.innerHTML = headerHTML;

                // Build Rows (Twist excluded)
                const rows = [
                    { key: 'camber', label: 'Profundidad (Camber)', unit: '%' },
                    { key: 'draft_pos', label: 'Posición Profundidad', unit: '%' },
                    { key: 'entry', label: 'Ángulo Entrada', unit: '°' },
                    { key: 'exit', label: 'Ángulo Salida', unit: '°' }
                ];

                tbody.innerHTML = '';
                rows.forEach(r => {
                    let rowHTML = `<tr style="border-bottom: 1px solid #1e293b;"><td style="padding: 8px;">${r.label}</td>`;
                    stripes.forEach(s => {
                        const val = s.metrics[r.key];
                        const displayVal = (val !== undefined && val !== null) ? `${val}${r.unit}` : '-';
                        const style = r.key === 'camber' ? 'color:#38bdf8;font-weight:bold;' : '';
                        rowHTML += `<td style="padding: 8px; ${style}">${displayVal}</td>`;
                    });
                    rowHTML += '</tr>';
                    tbody.innerHTML += rowHTML;
                });
            } else {
                thead.innerHTML = '';
                tbody.innerHTML = '<tr><td colspan="5">No se encontraron métricas.</td></tr>';
            }

            // 4. Chart (Multi-Stripe Support)
            renderChart(m);

        } catch (e) {
            console.error(e);
            alert('Error cargando el informe');
        }
    }

    function renderChart(metrics) {
        const ctx = document.getElementById('camberChart').getContext('2d');
        let datasets = [];

        const colors = ['#00ff00', '#00ffff', '#ff00ff', '#f59e0b'];
        const getCol = (id) => colors[(id - 1) % colors.length];

        // 0. Chord Line (Reference)
        datasets.push({
            label: 'Cuerda',
            data: [{ x: 0, y: 0 }, { x: 100, y: 0 }],
            borderColor: '#94a3b8', // slate-400
            borderDash: [5, 5],
            borderWidth: 2,
            showLine: true,
            pointRadius: 0,
            order: 1 // Draw behind if possible, but Chart.js draws array order.
        });

        // 1. Use stripes array if available (New format)
        if (metrics.stripes && Array.isArray(metrics.stripes)) {
            datasets = metrics.stripes.map(s => {
                if (!s.metrics.normalized_curve) return null;
                return {
                    label: `Franja #${s.id}`,
                    data: s.metrics.normalized_curve.map(p => ({ x: p.x * 100, y: p.y })),
                    borderColor: getCol(s.id),
                    backgroundColor: getCol(s.id),
                    showLine: true,
                    tension: 0.4,
                    pointRadius: 0
                };
            }).filter(Boolean);
        }
        // 2. Fallback to single curve (Legacy/Single)
        else if (metrics.normalized_curve) {
            datasets = [{
                label: 'Perfil de Curvatura',
                data: metrics.normalized_curve.map(p => ({ x: p.x * 100, y: p.y })),
                borderColor: '#38bdf8',
                backgroundColor: 'rgba(56, 189, 248, 0.2)',
                showLine: true,
                tension: 0.4
            }];
        }

        new Chart(ctx, {
            type: 'scatter',
            data: { datasets: datasets },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                aspectRatio: 16 / 9,
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        title: { display: true, text: 'Longitud Cuerda (%)' },
                        min: 0, max: 100,
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    },
                    y: {
                        title: { display: true, text: 'Profundidad (%)' },
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }
</script>
{% endblock %}
