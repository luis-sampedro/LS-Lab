{% extends "base.html" %}

{% block title %}Iniciar Sesión - LS Lab{% endblock %}

{% block content %}
<div class="auth-container"
    style="max-width: 400px; margin: 4rem auto; padding: 2rem; background: #0f172a; border: 1px solid #1e293b; border-radius: 12px;">
    <h2 style="text-align: center; margin-bottom: 2rem; color: #38bdf8;">Acceso</h2>

    <form id="loginForm" class="auth-form">
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="email" style="display: block; color: #94a3b8; margin-bottom: 0.5rem;">Correo electrónico</label>
            <input type="email" id="email" required autocomplete="username"
                style="width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px;">
        </div>

        <div class="form-group" style="margin-bottom: 2rem;">
            <label for="password" style="display: block; color: #94a3b8; margin-bottom: 0.5rem;">Contraseña</label>
            <input type="password" id="password" required autocomplete="current-password"
                style="width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px;">
        </div>

        <button type="submit" class="btn primary" style="width: 100%; justify-content: center;">Iniciar Sesión</button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; color: #64748b;">
        ¿No tienes cuenta? <a href="{{ url_for('signup', lang='es') }}" style="color: #38bdf8;">Regístrate</a>
    </p>
    <div id="error-msg" style="color: #ef4444; text-align: center; margin-top: 1rem; display: none;"></div>
</div>

<script type="module">
    import { auth, signInWithEmailAndPassword } from "{{ url_for('static', filename='js/firebase-init.js') }}";

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            // Successful login
            const user = userCredential.user;
            const idToken = await user.getIdToken();

            // Send token to server
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken: idToken })
            });

            if (response.ok) {
                // Ensure we redirect to the Spanish dashboard
                window.location.href = "{{ url_for('dashboard', lang='es') }}";
            } else {
                errorMsg.innerText = "Error de autenticación en el servidor";
                errorMsg.style.display = 'block';
            }

        } catch (error) {
            let msg = error.message;
            // Basic translation of common firebase errors
            if (msg.includes('auth/invalid-email')) msg = 'Correo electrónico inválido.';
            if (msg.includes('auth/user-not-found') || msg.includes('auth/wrong-password')) msg = 'Correo o contraseña incorrectos.';

            errorMsg.innerText = msg;
            errorMsg.style.display = 'block';
        }
    });
</script>
{% endblock %}
